[program:products-backend-price-refresh-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/products-backend/artisan queue:work database --queue=price-refresh --sleep=1 --tries=0 --timeout=300 --max-time=3600 --max-jobs=200 --memory=384
directory=/var/www/products-backend
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopsignal=TERM
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/products-backend/storage/logs/worker-price-refresh.log
stopwaitsecs=330
