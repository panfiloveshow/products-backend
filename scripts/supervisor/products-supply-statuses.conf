[program:products-backend-supply-status-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php8.4 /var/www/products-backend/artisan queue:work database --queue=supply-status-batches,supply-statuses --sleep=2 --tries=3 --timeout=120 --max-time=3600 --memory=256 --max-jobs=200
directory=/var/www/products-backend
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopsignal=TERM
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/products-backend/storage/logs/worker-supply-statuses.log
stopwaitsecs=150
