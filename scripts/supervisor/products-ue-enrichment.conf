[program:products-backend-ue-enrichment-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/products-backend/artisan queue:work database --queue=unit-economics-enrichment --sleep=2 --tries=0 --timeout=1800 --max-time=3600 --max-jobs=50 --memory=512
directory=/var/www/products-backend
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopsignal=TERM
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/products-backend/storage/logs/worker-ue-enrichment.log
stopwaitsecs=1830
