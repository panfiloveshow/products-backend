# Include in nginx's http context, before the products server block.
# Use the original route before /index.php rewriting, without query parameters.
map $request_uri $products_request_path {
    default $uri;
    ~^([^?]*) $1;
}

log_format products_diagnostics escape=json
    '{"time":"$time_iso8601","request_id":"$request_id",'
    '"method":"$request_method","path":"$products_request_path",'
    '"status":$status,"request_time":$request_time,'
    '"upstream_response_time":"$upstream_response_time"}';

# In the products.sellico.ru server block:
# access_log /var/log/nginx/products-access.log products_diagnostics;
# add_header X-Request-Id $request_id always;
